<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="AI Project Manager Bot built with n8n">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea4b71"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#94a3b8" stroke-opacity="0.08">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/>
  </g>

  <!-- workflow connections -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-opacity="0.9">
    <path d="M170 225 C 230 225, 230 140, 290 140"/>
    <path d="M170 225 C 230 225, 230 310, 290 310"/>
    <path d="M390 140 C 450 140, 450 225, 510 225"/>
    <path d="M390 310 C 450 310, 450 225, 510 225"/>
    <path d="M610 225 C 650 225, 650 225, 690 225"/>
  </g>

  <!-- nodes -->
  <g>
    <!-- trigger node -->
    <rect x="90" y="195" width="80" height="60" rx="14" fill="#ea4b71"/>
    <text x="130" y="232" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">n8n</text>

    <!-- AI node -->
    <rect x="290" y="110" width="100" height="60" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="340" y="147" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#c4b5fd" text-anchor="middle">AI · LLM</text>

    <!-- integrations node -->
    <rect x="290" y="280" width="100" height="60" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="340" y="305" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd" text-anchor="middle">Discord · Trello</text>
    <text x="340" y="325" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd" text-anchor="middle">GitHub · Email</text>

    <!-- PM node -->
    <rect x="510" y="195" width="100" height="60" rx="14" fill="#1e293b" stroke="#ea4b71" stroke-width="2"/>
    <text x="560" y="220" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#fda4af" text-anchor="middle">Scrumban</text>
    <text x="560" y="240" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#fda4af" text-anchor="middle">PM Bot</text>

    <!-- output dot -->
    <circle cx="700" cy="225" r="12" fill="#22c55e" filter="url(#soft)"/>
    <circle cx="700" cy="225" r="6" fill="#bbf7d0"/>
  </g>

  <!-- title -->
  <text x="400" y="55" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#f1f5f9" text-anchor="middle">AI Project Manager Bot</text>
  <text x="400" y="412" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle">Self-hosted n8n · Gemini / OpenAI · Ubuntu Server VPS</text>
</svg>
